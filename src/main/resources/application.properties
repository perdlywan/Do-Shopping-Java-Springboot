spring.application.name=do-shopping


#spring.datasource.url=jdbc:mysql://localhost:3306/do_shopping?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://mysql:3306/do_shopping?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=1234

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Asia/Jakarta

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs