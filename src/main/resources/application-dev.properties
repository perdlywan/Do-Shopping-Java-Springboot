spring.datasource.url=jdbc:mysql://localhost:3306/do_shopping?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.output.ansi.enabled=always

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) %magenta(${PID}) --- [%15.15t] %cyan(%-40.40logger{39}) : %msg%n

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.tomcat=WARN
logging.level.com.example.do_shopping=DEBUG
